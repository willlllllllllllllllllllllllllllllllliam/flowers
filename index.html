<!doctype html>
<html lang="en">
  <head>
    <!-- This asks search engines not to list the page. It does not make notes private. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta
      name="description"
      content="A little garden. A few words. Something to keep."
    />
    <title>Flowers - a little garden for you</title>
    <link rel="icon" href="assets/flower.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Edit notes.js for the words. The scripts below draw the garden. -->
    <script defer src="notes.js"></script>
    <script defer src="js/gardens.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/canvas-renderer.js"></script>
    <script defer src="js/garden.js"></script>
  </head>
  <body>
    <main id="paper">
      <header class="masthead">
        <span class="wordmark"
          >flowers<button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Switch to night mode"
            aria-pressed="false"
            title="Switch to night mode"
          >
            <svg
              class="theme-moon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M17.9 16.6C11.8 17.6 7.1 12.7 8.6 6.4C4.9 8.2 3.8 12.9 5.7 16.3C8.2 20.7 14.5 21.1 17.9 16.6Z"
              />
            </svg>
            <svg
              class="theme-sun"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M15.9 11.8C16.1 14.1 14.3 16 12.1 16.1C9.8 16.1 7.9 14.4 7.9 12.1C7.8 9.9 9.5 7.9 11.8 7.9C14 7.8 15.8 9.6 15.9 11.8Z M12 2.3L12.1 4.7 M18.9 5L17.3 6.8 M21.6 12.1L19.2 12 M18.8 19L17.1 17.2 M11.8 21.7L11.9 19.2 M4.9 18.8L6.8 17.1 M2.4 11.8L4.8 11.9 M5.1 4.9L6.7 6.8"
              />
            </svg></button
        ></span>
      </header>
      <section id="letter" class="letter" aria-label="Your notes">
        <p id="note-to" class="salutation" hidden></p>
        <div class="note-space">
          <p
            id="note-text"
            class="note-text"
            aria-live="polite"
            aria-atomic="true"
          ></p>
          <p id="note-error" class="note-error" role="alert" hidden></p>
        </div>
        <p id="note-from" class="signature" hidden></p>
        <nav id="note-nav" hidden class="note-nav" aria-label="Browse notes">
          <button
            id="prev-note"
            class="arrow"
            type="button"
            aria-label="Previous note"
          >
            <svg viewBox="0 0 48 24" aria-hidden="true">
              <path d="M42 12C29 11 17 13 6 12M16 4L6 12l10 8" />
            </svg>
          </button>
          <span id="note-counter" class="note-counter" aria-live="off"></span>
          <button
            id="next-note"
            class="arrow"
            type="button"
            aria-label="Next note"
          >
            <svg viewBox="0 0 48 24" aria-hidden="true">
              <path d="M6 12c13-1 25 1 36 0M32 4l10 8-10 8" />
            </svg>
          </button>
        </nav>
      </section>
      <svg id="hearts" aria-hidden="true" focusable="false"></svg>
      <div class="garden-wrap" aria-hidden="true">
        <svg
          id="garden"
          xmlns="http://www.w3.org/2000/svg"
          focusable="false"
        ></svg>
      </div>
    </main>
    <noscript
      ><p class="no-script">
        Enable JavaScript to draw the garden and browse the notes.
      </p></noscript
    >
  </body>
</html>
